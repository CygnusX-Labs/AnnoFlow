# =============================================================================
# AnnoFlow - 默认配置（仓库级默认值）
# =============================================================================
# 配置优先级链（Flow framework §3.1）:
#   config 四件套（本文件） < analysisyaml（项目级） < --config key=value（命令行）
#
# 项目级配置请复制 examples/analysisyaml.example.yaml 修改后通过
#   --config analysisyaml=/path/to/your.yaml 传入。
# 仓库内禁止写入真实机器绝对路径 / 内网 IP（§1.3），站点路径走 reference.yaml
# 占位 + analysisyaml 覆盖。

# 流程控制
pipeline_version: "AnnoFlow v1.0.0"   # 版本唯一来源（§3.3）
log_level: INFO
print_target: false                   # dry-run 时打印目标列表（§12.1）

# 执行模式（§3.2）：local | cluster；cluster 需配置 cluster_config.yaml 的 clusters 映射
execution_mode: local
queue_id: ""

# 输入蛋白序列目录（项目级绝对路径，经 analysisyaml / --config 覆盖）
input_dir: ""

# 输入 MD5 门控（§4）：input_dir 中期望的校验文件名；文件不存在时只记录基线（SRA 兼容原则）
raw_data:
  md5: md5.txt

# -----------------------------------------------------------------------------
# 模块开关（默认值必须显式写出，§3.3；读取键与文档/schema 完全一致）
# -----------------------------------------------------------------------------
eggnog: true        # eggnog-mapper 功能注释（KEGG/GO/COG/EC/Pfam/CAZy）
kofamscan: true     # KofamScan KO 注释
integrate: true     # eggnog + KofamScan 整合评分与冲突裁决
merge: true         # 多样本合并与汇总
ai: false           # AI 逐蛋白可靠性评估（需配置 ai_config）
deliver: true       # 交付 delivery_manifest（copy 模式，§6.4）
report: true        # project_summary.json（§6.5 最小报告）

# -----------------------------------------------------------------------------
# AI 提供商设置（仅当模块开关 ai: true 时消费）
# ⚠️ 安全：api_key 只写环境变量名（全大写），真实 key 经 export 注入，详见 README 安全指南
# -----------------------------------------------------------------------------
ai_config:
  provider: ollama          # ollama | openai | claude
  model: llama3.2
  api_key: ""               # 如 "AI_API_KEY" / "ARK_API_KEY"（环境变量名占位）
  api_base: ""              # 如 "https://dashscope.aliyuncs.com/compatible-mode/v1"
  taxonomy: "Unknown"       # 物种分类，用于 AI 判断注释合理性，如 "Viridiplantae;Streptophyta"
  max_proteins: 50          # 分层筛选后送 AI 的最大蛋白数
  no_auto_filter: false     # true = 全量送 AI（高 token 消耗）

# -----------------------------------------------------------------------------
# 处理脚本路径（相对仓库根目录；可被 analysisyaml 覆盖）
# -----------------------------------------------------------------------------
scripts:
  eggnog_processor: "scripts/eggnog_processor.py"
  kofamscan_processor: "scripts/kofamscan_processor.py"
  merge_results: "scripts/merge_results.py"
  integrate_annotations: "scripts/integrate_annotations.py"
  compare_kegg_annotations: "scripts/compare_kegg_annotations.py"
  export_annotation_sets: "scripts/export_annotation_sets.py"
  ai_curator: "scripts/ai_curator.py"
  check_input_md5: "scripts/check_input_md5.py"
  deliver: "scripts/deliver.py"
